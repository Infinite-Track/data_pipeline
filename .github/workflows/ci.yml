name: CI

# 쿠버네티스(EKS)에서 돌릴 파이프라인 이미지를 GHCR 에 올린다.
# 배포는 여기서 하지 않는다 — seoulection-gitops 의 values/prod/pipeline.yaml 의 image.tag 를 이 sha 태그로 바꾸면 반영된다.
#
# ⚠️ 2026-10 현재 정기 실행은 v1(Prefect 스케줄)에서만 한다. EKS 의 CronJob 은 suspend 상태라 이미지를 올려도 돌지 않는다.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # PR 에서는 빌드까지만(Dockerfile 이 깨졌는지 미리 본다), main 에서만 push 한다.
  image:
    name: 이미지 빌드 (main이면 GHCR push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: GHCR 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🔴 소유자명이 대문자(Infinite-Track)라 이름을 그대로 쓰면 push 가 실패한다 — 이 액션이 소문자로 바꾼다.
      # sha-<커밋7자리> 는 불변 — gitops 에는 latest 가 아니라 이 태그를 적는다.
      - name: 이미지 이름·태그 계산
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/seoulection-pipeline
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 빌드 (main이면 push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ⚠️ EKS 노드가 x86_64 다. 맥(arm64)에서 만든 이미지는 exec format error 로 안 뜬다.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
